# in the templates via {{ site.myvariable }}.

title: Impedance Mismatches
email: bvetter@gmail.com
author: Brian Vetter

description: >- # this means to ignore newlines until "baseurl:"
  Conserving the energy of software development 
github_username: bvett
domain: bvett.github.io
# baseurl: /docs # the subpath of your site, e.g. /blog
url:  https://bvett.github.io # the base hostname & protocol for your site, e.g. http://example.com


avatar: "//www.gravatar.com/avatar/your_email_md5?d=mm&s=135"
profile: Software Engineer specializing in SDLC automation and developer productivity.
profile_links:
  - name: "GitHub"
    url: "https://github.com/bvett"
    icon: "/images/GitHub_Invertocat_Black_Clearspace.svg"
  - name: "LinkedIn"
    url: "https://linkedin.com/in/bvett"
    icon: "/images/LI-In-Bug.png"
  - name: "bvetter@gmail.com"
    url: "mailto:bvetter@gmail.com" 

excerpt_separator: <!--more-->

header:
  links:
    About the Blog: /about-the-blog/
    About the Author: /about-the-author/

permalink: /articles/:title
plugins:
 - jekyll-paginate
 - jekyll-gist
 - jemoji


# Build settings
paginate: 5
paginate_path: "page:num"

highlighter: rouge
markdown: kramdown

# https://jekyllrb.com/docs/configuration/#precedence
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax



